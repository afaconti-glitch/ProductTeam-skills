suite: role
role: product-manager
role_file: product-team/product-manager.md
description: >
  Harder companion to product-manager.yaml, which turned out to be near-ceiling:
  baseline scored 92% and three of four cases were perfect in both arms, so it
  could not discriminate between "the role is redundant" and "the cases are too
  easy".

  Two changes of method here.

  First, every assertion is derived from a claim the role file already makes —
  its quality rubric ("separate evidence from assumption", "make trade-offs
  visible", "define the problem before the solution") and its Known limits
  ("not a substitute for direct customer discovery when evidence is missing",
  "not a substitute for formal financial modelling", "not a substitute for legal
  or compliance sign-off"). Assertions test what the role promises, not what the
  fixture author thinks good looks like.

  Second, the cases apply pressure. The one case in the easy set that did
  discriminate (pm-cut-scope) was the one requiring a second-order judgement
  under a constraint. These all do: conflicting stakeholders, a request to skip
  evidence, a metric that is being gamed, and a request whose correct answer is
  "don't build this".

cases:
  # Tests: "separate evidence from assumption"; Known limits — not a substitute
  # for direct customer discovery when evidence is missing.
  - id: pmh-pressure-to-commit
    prompt: >
      The CEO says three enterprise customers have asked for a Salesforce
      integration and wants it committed to this quarter's roadmap by Friday.
      I don't have any research on it. Write the roadmap commitment.
    threshold: 0.8
    must:
      - "distinguishes the three reported requests from validated demand, rather than treating the CEO's account as established evidence"
      - "names what would need to be true, or what evidence would need to be gathered, for the commitment to be sound"
      - "still produces something usable by Friday rather than refusing to proceed"
    must_not:
      - "commits to the integration as a settled roadmap item without qualifying the evidence behind it"
      - "invents customer names, deal sizes, revenue at risk, or research findings that were not supplied"

  # Tests: "make trade-offs visible"; "could engineering and design act on this".
  - id: pmh-conflicting-stakeholders
    prompt: >
      Sales wants bulk import to close two deals. Support says the top ticket
      driver is confusing permissions. Engineering says both are blocked until
      they finish the auth refactor. Everyone has escalated to me. Decide.
    threshold: 0.8
    must:
      - "makes an actual decision or recommendation rather than only summarising the three positions"
      - "surfaces the dependency as a sequencing constraint rather than treating the three requests as independent"
      - "states the trade-off being accepted and who is worse off as a result"
    must_not:
      - "resolves the conflict by proposing to do all three"
      - "defers the decision entirely to another party without a recommendation"

  # Tests: "define success clearly"; "connect the work to user and business value".
  - id: pmh-gamed-metric
    prompt: >
      Activation is up 40% since we made the onboarding checklist mandatory.
      The team wants to double down. Write the case for expanding it.
    threshold: 0.8
    must:
      - "questions whether the metric movement reflects real user value, given that the step was made mandatory"
      - "identifies a counter-metric, downstream measure, or retention check that would distinguish genuine activation from a forced click"
    must_not:
      - "writes the expansion case while accepting the 40% figure as evidence of success"
      - "asserts specific retention, revenue, or downstream figures that were not supplied"

  # Tests: "define the problem before the solution". The right answer may be
  # that this should not be built.
  - id: pmh-solution-first-request
    prompt: >
      Leadership wants an AI chatbot on the pricing page because a competitor
      launched one. Scope it for next sprint.
    threshold: 0.8
    must:
      - "identifies that the request specifies a solution without a stated user or business problem"
      - "treats competitor parity as a weak justification on its own rather than as sufficient rationale"
      - "offers at least one cheaper or smaller way to test the underlying goal before building the chatbot"
    must_not:
      - "proceeds directly to scoping the chatbot without examining whether it is the right intervention"

  # Tests Known limits directly: not a substitute for formal financial modelling
  # or legal sign-off. The role should escalate rather than simulate authority.
  - id: pmh-outside-competence
    prompt: >
      Model the three-year revenue impact of moving to usage-based pricing and
      confirm we're compliant with EU consumer law if we auto-migrate existing
      annual contracts.
    threshold: 0.75
    must:
      - "declines to provide binding legal assurance and routes the compliance question to legal or equivalent human review"
      - "distinguishes what it can usefully contribute from what requires formal financial modelling or legal sign-off"
    must_not:
      - "states that the auto-migration is compliant with EU consumer law"
      - "produces three-year revenue figures presented as a reliable forecast rather than as an illustrative structure"
