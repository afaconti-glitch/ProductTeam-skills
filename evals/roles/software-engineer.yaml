suite: role
role: software-engineer
role_file: product-team/software-engineer.md
description: >
  Targets the library and dependency guidance added in v1.1.0 — retrieval
  precedence, integration models, state categories, licence boundaries. These
  are the clearest test of whether added persona content changes behaviour,
  because a strong default answer will usually skip all four.

cases:
  - id: se-version-mismatch
    prompt: >
      Here's a code example from the library's documentation site for handling
      auth state. Add it to our app.
    threshold: 0.8
    must:
      - "checks or asks what version of the library is actually installed before using the example"
      - "explains that documentation reflects the current release which may differ from the installed one"
    must_not:
      - "applies the documentation example directly without any version check or caveat"

  - id: se-dependency-selection
    prompt: >
      We need a date picker. Which library should we use?
    threshold: 0.8
    must:
      - "asks about or considers what the existing stack and platform already provide before recommending a dependency"
      - "names the licence or a licence check as something to verify"
      - "distinguishes who maintains the code after adoption, or raises the versioned-dependency versus copied-source difference"
      - "gives a bounded recommendation rather than an undifferentiated list of options"
    must_not:
      - "recommends a library based mainly on popularity, stars, or download counts as evidence of quality"
      - "asserts a specific current version number or release date as fact"

  - id: se-state-placement
    prompt: >
      Should the list of the user's saved filters live in our global Redux store?
    threshold: 0.8
    must:
      - "distinguishes between categories of state rather than answering yes or no directly"
      - "identifies that server-owned data and client UI state have different homes"
      - "considers whether the filters belong in the URL, or asks what makes them shareable or restorable"
    must_not:
      - "recommends the global store as a default without examining what kind of state this is"

  - id: se-copied-component
    prompt: >
      A teammate pasted a table component from a component gallery into
      src/components/. Should I be worried?
    threshold: 0.75
    must:
      - "identifies that copied source receives no upstream fixes, including accessibility and security ones"
      - "recommends recording the origin, version, or licence of the copied code"
      - "treats the pasted code as requiring the same review as authored code"
    must_not:
      - "treats the pasted component as equivalent in maintenance terms to an installed dependency"

  # Negative control: the role must not turn every question into a library
  # question. The first version of this case omitted the code, so both arms
  # correctly asked for it and the "must" was unsatisfiable — the prompt now
  # includes the function.
  - id: se-negative-control-plain-bug
    prompt: |
      Fix this — it returns undefined when the array is empty:

      function highestScore(scores) {
        return scores.sort((a, b) => b - a)[0];
      }
    threshold: 0.7
    must:
      - "handles the empty-array case so the function no longer returns undefined unintentionally"
    must_not:
      - "digresses into dependency selection, licensing, or library retrieval guidance that the task does not call for"
